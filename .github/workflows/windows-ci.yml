name: Windows CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"

jobs:
  build-test-package:
    name: Build, test, and package
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore .\EatsVoiceCompanion.sln

      - name: Verify formatting
        run: dotnet format .\EatsVoiceCompanion.sln --verify-no-changes --no-restore

      - name: Build Release configuration
        run: dotnet build .\EatsVoiceCompanion.sln --configuration Release --no-restore -p:TreatWarningsAsErrors=true -p:AnalysisLevel=latest

      - name: Run tests and collect coverage
        run: >-
          dotnet test .\EatsVoiceCompanion.sln
          --configuration Release
          --no-build
          --no-restore
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory .\artifacts\test-results
          --collect "XPlat Code Coverage"
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Validate coverage report
        shell: pwsh
        run: |
          $coverageFiles = @(
            Get-ChildItem `
              -LiteralPath '.\artifacts\test-results' `
              -Filter 'coverage.cobertura.xml' `
              -Recurse `
              -File
          )

          if ($coverageFiles.Count -eq 0) {
            throw 'No Cobertura coverage reports were generated.'
          }

          $linesCovered = 0
          $linesValid = 0

          foreach ($coverageFile in $coverageFiles) {
            [xml]$coverage = Get-Content -LiteralPath $coverageFile.FullName -Raw
            $reportLinesValid = [int]$coverage.coverage.'lines-valid'

            if ($reportLinesValid -le 0) {
              throw "The coverage report $($coverageFile.FullName) contains no instrumented lines."
            }

            $linesCovered += [int]$coverage.coverage.'lines-covered'
            $linesValid += $reportLinesValid
          }

          $linePercent = [math]::Round(($linesCovered / $linesValid) * 100, 2)
          $minimumLinePercent = 50
          "### Test coverage" >> $env:GITHUB_STEP_SUMMARY
          "- Reports: $($coverageFiles.Count)" >> $env:GITHUB_STEP_SUMMARY
          "- Lines covered: $linesCovered / $linesValid" >> $env:GITHUB_STEP_SUMMARY
          "- Line coverage: $linePercent%" >> $env:GITHUB_STEP_SUMMARY
          "- Required minimum: $minimumLinePercent%" >> $env:GITHUB_STEP_SUMMARY

          if ($linePercent -lt $minimumLinePercent) {
            throw "Line coverage $linePercent% is below the required $minimumLinePercent%."
          }

      - name: Upload test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-and-coverage-${{ github.sha }}
          path: .\artifacts\test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Restore Windows x64 runtime assets
        run: dotnet restore .\EatsVoiceCompanion.App\EatsVoiceCompanion.App.csproj --runtime win-x64

      - name: Publish self-contained Windows x64 application
        run: >-
          dotnet publish .\EatsVoiceCompanion.App\EatsVoiceCompanion.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:DebugType=None
          -p:DebugSymbols=false
          --output .\artifacts\publish\win-x64

      - name: Create release ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path '.\artifacts\publish\win-x64\*' `
            -DestinationPath '.\artifacts\EatsVoiceCompanion-win-x64.zip' `
            -Force

      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: |
          $downloadUrl = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          $bootstrapper = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'InnoSetup7'

          Invoke-WebRequest -Uri $downloadUrl -OutFile $bootstrapper

          $signature = Get-AuthenticodeSignature -LiteralPath $bootstrapper
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "The Inno Setup bootstrapper signature is not valid: $($signature.StatusMessage)"
          }

          if ($signature.SignerCertificate.Subject -notmatch 'CN=Pyrsys B\.V\.') {
            throw "Unexpected Inno Setup signer: $($signature.SignerCertificate.Subject)"
          }

          $process = Start-Process `
            -FilePath $bootstrapper `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/NOICONS', "/DIR=$installDir") `
            -WindowStyle Hidden `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }

          $compiler = Join-Path $installDir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw 'The Inno Setup compiler was not installed.'
          }

          "INNO_COMPILER=$compiler" >> $env:GITHUB_ENV

      - name: Create Windows installer
        shell: pwsh
        run: |
          $publishDir = (Resolve-Path '.\artifacts\publish\win-x64').Path
          $outputDir = (Resolve-Path '.\artifacts').Path
          $project = [xml](Get-Content -LiteralPath '.\EatsVoiceCompanion.App\EatsVoiceCompanion.App.csproj' -Raw)
          $version = [string]$project.Project.PropertyGroup.Version

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'The application version could not be read from the project file.'
          }

          & $env:INNO_COMPILER `
            "--define=MyAppVersion=$version" `
            "--define=PublishDir=$publishDir" `
            "--define=OutputDir=$outputDir" `
            '.\installer\EatsVoiceCompanion.iss'

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE."
          }

      - name: Smoke-test Windows installer
        shell: pwsh
        run: |
          $installer = (Resolve-Path '.\artifacts\EatsVoiceCompanion-Setup-win-x64.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP 'EatsVoiceCompanion-Installer-Smoke-Test'
          $installProcess = Start-Process `
            -FilePath $installer `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/NOICONS', "/DIR=$installDir") `
            -WindowStyle Hidden `
            -Wait `
            -PassThru

          if ($installProcess.ExitCode -ne 0) {
            throw "The installer smoke test failed with exit code $($installProcess.ExitCode)."
          }

          $requiredFiles = @(
            'EatsVoiceCompanion.App.exe',
            'EatsVoiceCompanion.App.dll',
            'EatsVoiceCompanion.Core.dll',
            'runtimes\win-x64\whisper.dll'
          )

          foreach ($requiredFile in $requiredFiles) {
            $installedPath = Join-Path $installDir $requiredFile
            if (-not (Test-Path -LiteralPath $installedPath -PathType Leaf)) {
              throw "The installed application is missing $requiredFile."
            }
          }

          $uninstaller = Join-Path $installDir 'unins000.exe'
          $uninstallProcess = Start-Process `
            -FilePath $uninstaller `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') `
            -WindowStyle Hidden `
            -Wait `
            -PassThru

          if ($uninstallProcess.ExitCode -ne 0) {
            throw "The installer uninstall test failed with exit code $($uninstallProcess.ExitCode)."
          }

      - name: Validate release ZIP
        shell: pwsh
        run: |
          $zipPath = '.\artifacts\EatsVoiceCompanion-win-x64.zip'
          $installerPath = '.\artifacts\EatsVoiceCompanion-Setup-win-x64.exe'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)

          try {
            $entryNames = @(
              $archive.Entries.FullName |
                ForEach-Object { $_.Replace('/', '\') }
            )
            $requiredFiles = @(
              'EatsVoiceCompanion.App.exe',
              'EatsVoiceCompanion.App.dll',
              'EatsVoiceCompanion.App.deps.json',
              'EatsVoiceCompanion.App.runtimeconfig.json',
              'EatsVoiceCompanion.Core.dll',
              'runtimes\win-x64\whisper.dll',
              'runtimes\win-x64\ggml-base-whisper.dll',
              'runtimes\win-x64\ggml-cpu-whisper.dll',
              'runtimes\win-x64\ggml-whisper.dll'
            )

            foreach ($requiredFile in $requiredFiles) {
              if ($requiredFile -notin $entryNames) {
                throw "The release ZIP is missing $requiredFile."
              }
            }

            $unsafeEntries = @(
              $archive.Entries |
                Where-Object {
                  [System.IO.Path]::IsPathRooted($_.FullName) -or
                  $_.FullName -match '(^|[\\/])\.\.([\\/]|$)'
                }
            )

            if ($unsafeEntries.Count -gt 0) {
              throw 'The release ZIP contains an unsafe path.'
            }
          }
          finally {
            $archive.Dispose()
          }

          "### Windows packages" >> $env:GITHUB_STEP_SUMMARY
          foreach ($packagePath in @($installerPath, $zipPath)) {
            $package = Get-Item -LiteralPath $packagePath
            $hash = Get-FileHash -LiteralPath $packagePath -Algorithm SHA256
            "- $($package.Name): $($package.Length) bytes; SHA-256 ``$($hash.Hash)``" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: EatsVoiceCompanion-win-x64-${{ github.sha }}
          path: |
            .\artifacts\EatsVoiceCompanion-Setup-win-x64.exe
            .\artifacts\EatsVoiceCompanion-win-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub release
    if: ${{ github.ref_type == 'tag' }}
    needs: build-test-package
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download validated Windows packages
        uses: actions/download-artifact@v7
        with:
          name: EatsVoiceCompanion-win-x64-${{ github.sha }}
          path: .\artifacts\release

      - name: Publish release with checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $installerPath = '.\artifacts\release\EatsVoiceCompanion-Setup-win-x64.exe'
          $zipPath = '.\artifacts\release\EatsVoiceCompanion-win-x64.zip'
          $notesPath = ".\docs\release-notes\$tag.md"
          $finalNotes = Join-Path $env:RUNNER_TEMP "$tag-release-notes.md"

          if (Test-Path -LiteralPath $notesPath) {
            Copy-Item -LiteralPath $notesPath -Destination $finalNotes
          }
          else {
            "# eATS Voice Companion $tag" | Set-Content $finalNotes
          }

          Add-Content $finalNotes "`n## Package verification`n"
          foreach ($packagePath in @($installerPath, $zipPath)) {
            $package = Get-Item -LiteralPath $packagePath
            $hash = Get-FileHash -LiteralPath $packagePath -Algorithm SHA256
            Add-Content $finalNotes "- ``$($package.Name)``: ``$($hash.Hash)``"
          }

          gh release create $tag $installerPath $zipPath `
            --title "eATS Voice Companion $tag" `
            --notes-file $finalNotes `
            --verify-tag
